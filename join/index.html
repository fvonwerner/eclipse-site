<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eclipse: invitation links have retired</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#06080E">
  <link rel="icon" href="../eclipse-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wdth,wght@0,6..12,75..125,300..900&display=swap" rel="stylesheet">
  <style>
    html { color-scheme: dark; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem;
      background: #06080E; color: #E7ECF5; line-height: 1.6;
      font-family: "Nunito Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; }
    main { max-width: 28rem; padding: 2.25rem; background: #0A0E17;
      border: 1px solid rgba(142, 172, 216, 0.17); border-radius: 24px; text-align: center;
      box-shadow: 0 40px 90px -40px #000, 0 0 80px -30px rgba(99, 205, 230, 0.3); }
    img { width: 72px; border-radius: 22.5%; }
    h1 { font-size: 1.625rem; font-weight: 800; font-variation-settings: "wdth" 118;
         letter-spacing: -0.02em; margin: 1.25rem 0 0.75rem; }
    p { color: rgba(231, 236, 245, 0.60); margin: 0 0 0.75rem; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #7BEBC4; }
    a { color: #49D7A2; font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <img src="../eclipse-icon.png" alt="">
    <h1>This invitation link has retired.</h1>
    <p>Eclipse connects friends by tag now, so there is nothing to open here.</p>
    <p>Ask your friend for their tag, the short one that looks like <code>@sam</code>, then open Eclipse, go to Friends, and add it. They approve the request and you are both in.</p>
    <p><a href="../">Learn more about Eclipse</a></p>
  </main>
</body>
</html>
